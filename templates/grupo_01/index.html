<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión de Medidas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #004494; }
        .resultado-box { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>Conversión de Medidas</h2>

    <form method="POST">
        <div class="form-group">
            <label for="valor">Valor a convertir:</label>
            <input type="text" id="valor" name="valor" value="{{ valor_ingresado }}" placeholder="Ej: 3.5" required>
        </div>

        <div class="form-group">
            <label for="tipo_conversion">Tipo de conversión:</label>
            <select id="tipo_conversion" name="tipo_conversion" required>
                <option value="" disabled {% if not tipo_seleccionado %}selected{% endif %}>Seleccione una opción...</option>
                {% for clave, datos in opciones.items() %}
                    <option value="{{ clave }}" {% if tipo_seleccionado == clave %}selected{% endif %}>
                        {{ datos.etiqueta }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Convertir</button>
    </form>

    {% if mensaje_exito %}
        <div class="resultado-box exito">
            <strong>Resultado:</strong> {{ mensaje_exito }}
        </div>
    {% endif %}

    {% if mensaje_error %}
        <div class="resultado-box error">
            <strong>Alerta:</strong> {{ mensaje_error }}
        </div>
    {% endif %}
</body>
</html>
